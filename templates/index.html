<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microscope Control Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container-fluid mt-2">
  <div class="row g-3">

    <!-- Left Column -->
    <div class="col-md-4 column">
      <h5>Preview</h5>
      <div class="preview-box mb-3"></div>

      <form method="POST">
        <div class="row mb-3">
          <div class="col">
            <label>ChannelGroup</label>
            <select class="form-select form-select-sm">
              <option>LED_light</option>
            </select>
          </div>
          <div class="col">
            <label>Channel</label>
            <select class="form-select form-select-sm">
              <option>off</option>
              <option>on</option>
            </select>
          </div>
          <div class="col">
            <label>Exposure</label>
            <input type="number" step="0.1" value="10.00" class="form-control form-control-sm">
          </div>
        </div>

        <div class="d-flex justify-content-around mb-3">
          <button name="action" value="snap" class="btn btn-outline-success btn-sm">Snap</button>
          <button name="action" value="live" class="btn btn-outline-primary btn-sm">Live</button>
        </div>

        <div class="row text-center">
          <div class="col">
            <h6>XY Stage</h6>
            <div>
              <button class="btn btn-sm btn-outline-secondary">⬆</button><br>
              <button class="btn btn-sm btn-outline-secondary">⬅</button>
              <button class="btn btn-sm btn-outline-secondary">➡</button><br>
              <button class="btn btn-sm btn-outline-secondary">⬇</button>
            </div>
            <input type="number" value="10.00" class="form-control form-control-sm my-1" style="width:80px;margin:auto;">
          </div>

          <div class="col">
            <h6>Z Stage</h6>
            <div>
              <button class="btn btn-sm btn-outline-secondary">⬆</button><br>
              <button class="btn btn-sm btn-outline-secondary">⬇</button>
            </div>
            <input type="number" value="10.00" class="form-control form-control-sm my-1" style="width:80px;margin:auto;">
          </div>
        </div>
      </form>
    </div>

    <!-- Middle Column -->
    <div class="col-md-4 column">
      <h5>Autofocus</h5>
      <form method="POST">
        <label>Range [µm]</label>
        <input type="number" name="range" value="10.00" class="form-control form-control-sm mb-2">
        <label>Step size [µm]</label>
        <input type="number" name="step" value="2.00" class="form-control form-control-sm mb-3">
        <button name="action" value="autofocus" class="btn btn-outline-primary btn-sm w-100">Run Autofocus</button>
      </form>

      <hr>

      <h5>Multi-tile Scan</h5>
      <form method="POST">
        <label>Grid size</label>
        <input type="number" value="3" class="form-control form-control-sm mb-2">
        <label>Overlap [%]</label>
        <input type="number" value="10" class="form-control form-control-sm mb-2">
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" checked>
          <label class="form-check-label">Enable stitching</label>
        </div>
        <button name="action" value="tilescan" class="btn btn-outline-secondary btn-sm w-100">Start Scan</button>
      </form>

      <hr>

      <h5>Overview Scan</h5>
      <form method="POST">
        <label>Zoom level</label>
        <input type="number" value="0.5" class="form-control form-control-sm mb-3">
        <button name="action" value="overview" class="btn btn-outline-secondary btn-sm w-100">Capture Overview</button>
      </form>
    </div>

    <!-- Right Column -->
    <div class="col-md-4 column">
      <h5>Multi-well Tool</h5>
      <form method="POST">
        <label>Plate type</label>
        <select class="form-select form-select-sm mb-2">
          <option>96-well</option>
          <option>384-well</option>
        </select>
        <label>Start well</label>
        <input type="text" value="A1" class="form-control form-control-sm mb-2">
        <label>End well</label>
        <input type="text" value="H12" class="form-control form-control-sm mb-3">
        <button name="action" value="multiwell" class="btn btn-outline-secondary btn-sm w-100">Run</button>
      </form>

      <hr>

      <h5>Bath Perfusion Tool</h5>
      <form method="POST">
        <label>Flow rate [mL/min]</label>
        <input type="number" value="1.0" class="form-control form-control-sm mb-2">
        <label>Duration [s]</label>
        <input type="number" value="60" class="form-control form-control-sm mb-3">
        <button name="action" value="perfusion" class="btn btn-outline-secondary btn-sm w-100">Start Perfusion</button>
      </form>
    </div>

  </div>
</div>
</body>
</html>
